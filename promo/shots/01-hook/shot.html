<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>01-hook · 哈基米A自吹 → 看见系统通知召唤B → 站立哈气对峙</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
  #root { position: absolute; inset: 0; background: #070811; overflow: hidden; }
  .slash { position: absolute; left: 50%; top: -100px; width: 2px; height: 1280px;
    background: linear-gradient(180deg, transparent, #fff 22%, #a78bfa 50%, #fff 78%, transparent);
    transform: translateX(-50%) rotate(-9deg); box-shadow: 0 0 32px #a78bfa, 0 0 70px rgba(167,139,250,0.65); z-index: 30; }

  #title-bar { position: absolute; left: 50%; top: 430px; width: 920px; margin-left: -460px; padding: 22px 36px;
    background: rgba(9, 11, 22, 0.94); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 30px 80px rgba(0,0,0,0.85), 0 0 50px rgba(167,139,250,0.35); text-align: center; z-index: 200;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px)); }
  #title-bar .zh { font-family: "SerifSC"; font-weight: 900; font-size: 76px; letter-spacing: 6px; color: #fff; }
  #title-bar .en { font-family: "Mono"; font-weight: 800; font-size: 18px; letter-spacing: 8px; color: #c4b5fd; margin-top: 6px; }
</style>
<script src="../../shared/kit.js"></script>
<script src="../../shared/ui.js"></script>
<script src="../../data/voice.js"></script>
</head>
<body>
<div id="stage">
  <div id="root">
    <canvas class="abs" id="bg" width="1920" height="1080"></canvas>
    <div class="grid"></div>
    <div class="bg-type" id="bgT1" style="left:40px;top:90px">OVERCONFIDENT</div>
    <div class="bg-type" id="bgT2" style="right:40px;bottom:80px">ADVERSARIAL</div>
    <div class="slash" id="slash"></div>
    <div id="title-bar"><div class="zh">哈基米哈气审查</div><div class="en">HAKIMI HISS DUEL // ADVERSARIAL SUB-AGENT REVIEW</div></div>
  </div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
</div>
<script>
const { tw, kf, ease, clamp, lerp, shake, onTwos } = K;
const $ = (id) => document.getElementById(id);
const A = "../../assets/chars/cut/";
const S = {}; ["S01", "S02", "S03", "S04", "S05"].forEach((id) => (S[id] = K.seg(id)));

const T = {
  b1: S.S01.start + 0.2,
  b2: S.S01.start + 2.7,
  rule1: S.S02.start - 0.35,   // 系统通知先叮一声弹出，A 看到后开口念 S02
  split: S.S02.start + 1.5,    // B 随系统通知召唤进场
  b3: S.S02.start + 0.2,
  b4: S.S03.start,
  hiss: S.S04.start,
  title: S.S04.end + 0.12,
};
window.SHOT = { start: 0, end: +(S.S05.start - 0.1).toFixed(3) };

let G = {};
window.__ready = (async () => {
  await document.fonts.load('900 80px "SerifSC"');
  await document.fonts.load('900 32px "SansSC"');
  await document.fonts.load('700 16px "Mono"');
  const im = await K.loadImages({ proud: A + "pose01.png", hissR: A + "pose02.png", hissL: A + "pose03.png" });
  build(im);
  await document.fonts.ready;
})();

function build(im) {
  const root = $("root");
  UI.hud(root, { left: "AGENT_A · 橘座 // POV: 1ST-PERSON", mid: "HAKIMI-HISS-CHANNEL · SESSION #01", right: "AGENT_B · 狸花" });

  G.proud = UI.char(root, im.proud, { x: 640, y: 1380, h: 1340, cls: "glow-a" });
  G.bProud1 = UI.polyBubble(root, {
    x: 980, y: 130, w: 620, h: 195, who: "GEMINI_A // SELF-ASSESSMENT", theme: "a", tailDir: "left",
    zh: '讲真，我的观察力<span class="hl-a">实在太敏锐了！</span>', en: "HONESTLY, MY EYE IS RAZOR-SHARP!",
  });
  G.bProud2 = UI.polyBubble(root, {
    x: 1080, y: 360, w: 660, h: 205, who: "GEMINI_A // CONFIDENCE: 99.9%", theme: "a", tailDir: "left", spiky: true,
    zh: '扫一眼代码，<span class="hl-a">直接把病根切出来！</span>', en: "ONE GLANCE AND I CUT THE ROOT CAUSE RIGHT OUT!",
  });
  G.bCrowd1 = UI.polyBubble(root, {
    x: 90, y: 420, w: 300, h: 130, who: "USER_LOG", theme: "v", tailDir: "right",
    zh: '<span style="font-size:24px">哇—Argon 好厉害！</span>', en: "SO IMPRESSIVE...",
  });

  // 系统规则通知 1（A 与 B 都能看见并当场念出来）
  G.rule1 = UI.sysNotice(root, {
    x: 560, y: 92, w: 800, code: "SYSTEM NOTICE // RULE 01: DUAL-AGENT HISS REVIEW", badge: "ENFORCED",
    zh: "【开启双子哈气对抗审查】已用同模型召唤哈基米B · 第一局抓虫多者获【一胜】",
    en: "Spawning identical Gemini Subagent B · Round 1 Rule: Most valid bugs takes [Round 1 Win]",
  });

  G.L = UI.char(root, im.hissR, { x: 450, y: 1250, h: 1080, cls: "glow-a" });
  G.R = UI.char(root, im.hissL, { x: 1470, y: 1250, h: 1080, cls: "glow-b" });

  G.bWait = UI.polyBubble(root, {
    x: 410, y: 265, w: 560, h: 190, who: "GEMINI_A // READING SYSTEM NOTICE", theme: "a", tailDir: "bottom-left",
    zh: '这系统通知写的啥……「双子哈气审查」？！<br>对面那只怎么<span class="hl-a">跟本喵一模一样？！</span>',
    en: "'DUAL HISS REVIEW'?! WHY DOES SHE LOOK JUST LIKE ME?!",
  });
  G.bTaunt = UI.polyBubble(root, {
    x: 960, y: 290, w: 560, h: 190, who: "GEMINI_B // READING SYSTEM NOTICE", theme: "b", tailDir: "bottom-right", spiky: true,
    zh: '本喵也收到通知了！抓虫多的拿<span class="hl-b">【一胜】</span>——<br>这库的虫子全归我！',
    en: "GOT THE NOTICE TOO! MOST BUGS TAKES ROUND 1—ALL MINE!",
  });

  G.sfxL = UI.sfxSerif(root, { x: 86, y: 110, zh: "哈——！", sub: "HISS // SUBAGENT_A", subColor: "#ff8ec7", align: "left" });
  G.sfxR = UI.sfxSerif(root, { x: 1330, y: 110, zh: "哈——！", sub: "HISS // SUBAGENT_B", subColor: "#7cc4ff", align: "right" });
}

function drawBg(t, inSplit, hitHiss) {
  const c = $("bg").getContext("2d");
  c.fillStyle = "#070811"; c.fillRect(0, 0, 1920, 1080);
  if (!inSplit) {
    const g = c.createRadialGradient(640, 480, 40, 640, 480, 760);
    g.addColorStop(0, "rgba(255, 110, 184, 0.24)"); g.addColorStop(1, "rgba(7, 8, 17, 0)");
    c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  } else {
    let g = c.createRadialGradient(450, 520, 30, 450, 520, 720);
    g.addColorStop(0, hitHiss ? "rgba(255, 96, 176, 0.34)" : "rgba(255, 96, 176, 0.18)");
    g.addColorStop(1, "rgba(7, 8, 17, 0)"); c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
    g = c.createRadialGradient(1470, 520, 30, 1470, 520, 720);
    g.addColorStop(0, hitHiss ? "rgba(86, 172, 255, 0.34)" : "rgba(86, 172, 255, 0.18)");
    g.addColorStop(1, "rgba(7, 8, 17, 0)"); c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  }
  if (hitHiss) {
    K.focusLines(c, 1920, 1080, 960, 520, 480, 120, t, { color: "rgba(255,255,255,0.12)", alpha: 1, seed: 5 });
  }
}

function render(t) {
  const inSplit = t >= T.split;
  const hitHiss = t >= T.hiss;
  drawBg(t, inSplit, hitHiss);

  const [sx, sy] = shake(t, T.hiss, 0.55, 22);
  const [sx2, sy2] = shake(t, T.rule1, 0.22, 8);
  $("root").style.transform = `translate(${sx + sx2}px,${sy + sy2}px)`;

  $("bgT1").style.opacity = inSplit ? 0.25 : 1;
  $("bgT2").style.opacity = inSplit ? 1 : 0;

  const p1Out = tw(t, T.split - 0.12, 0.22);
  const breath = Math.sin(t * 2.8) * 0.008;
  const laugh = t < S.S01.end ? Math.abs(Math.sin(onTwos(t) * 9)) * -9 : 0;
  UI.put(G.proud, { y: laugh, sy: 1 + breath, sx: 1 - breath * 0.5, o: 1 - p1Out });

  const hideB12 = tw(t, T.rule1, 0.2);
  const pb1 = tw(t, T.b1, 0.3, ease.outBack) * (1 - hideB12);
  const pb2 = tw(t, T.b2, 0.3, ease.outBack) * (1 - hideB12);
  const pc1 = tw(t, T.b1 + 0.6, 0.3, ease.outBack) * (1 - hideB12);
  UI.put(G.bProud1, { s: pb1, o: clamp(pb1 * 3), r: -1.5 });
  UI.put(G.bProud2, { s: pb2, o: clamp(pb2 * 3), r: 1.2 });
  UI.put(G.bCrowd1, { s: pc1, o: clamp(pc1 * 3), r: -2 });

  const pr1 = tw(t, T.rule1, 0.28, ease.outBack);
  UI.put(G.rule1, { y: (1 - pr1) * -40, s: pr1, o: clamp(pr1 * 3) });

  $("slash").style.opacity = tw(t, T.split, 0.25, ease.outCubic);

  const pL = tw(t, T.split, 0.32, ease.outCubic);
  const pR = tw(t, T.split + 0.08, 0.35, ease.outBack);
  const lunge = tw(t, T.hiss, 0.18, ease.outCubic) * 48 - tw(t, T.hiss + 0.25, 0.6, ease.inOutSine) * 18;
  const hissVib = hitHiss && t < T.hiss + 0.5 ? 1 + 0.035 * Math.sin(onTwos(t, 30) * 40) : 1;
  UI.put(G.L, { x: (1 - pL) * -240 + lunge, sy: hissVib, o: pL });
  UI.put(G.R, { x: (1 - pR) * 240 - lunge, s: pR, sy: hissVib, o: clamp(pR * 3) });

  const hideWait = tw(t, T.hiss - 0.1, 0.18);
  const pw = tw(t, T.b3, 0.28, ease.outBack) * (1 - hideWait);
  const pt = tw(t, T.b4, 0.28, ease.outBack) * (1 - hideWait);
  UI.put(G.bWait, { s: pw, o: clamp(pw * 3), r: -1.2 });
  UI.put(G.bTaunt, { s: pt, o: clamp(pt * 3), r: 1.2 });

  ["sfxL", "sfxR"].forEach((k, i) => {
    const p = tw(t, T.hiss + i * 0.05, 0.22, ease.outBack);
    UI.put(G[k], { s: lerp(2.2, 1, p), o: clamp(p * 3), r: i ? 4 : -4 });
  });

  const pTitle = tw(t, T.title, 0.32, ease.outBack);
  UI.put($("title-bar"), { s: pTitle, o: clamp(pTitle * 3) });

  $("flash").style.opacity = Math.max(
    kf(t, [[T.split - 0.01, 0], [T.split, 0.55], [T.split + 0.14, 0]]),
    kf(t, [[T.hiss - 0.01, 0], [T.hiss, 0.85], [T.hiss + 0.15, 0]])
  );
}

window.__seek = async (t) => { render(t); };
</script>
</body>
</html>
